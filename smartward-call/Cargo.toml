[package]
name = "smartward-call"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "SmartWard 呼叫引擎 — 纯 WebRTC P2P/SFU 双模，信令由上层处理"
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["call"]
call = ["call-p2p", "call-sfu"]
call-p2p = ["dep:libwebrtc", "dep:tokio"]
call-sfu = ["dep:livekit", "dep:livekit-api"]
ffi = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

libwebrtc = { workspace = true, optional = true }
livekit = { workspace = true, optional = true, features = ["__rustls-tls", "rustls-tls-webpki-roots"] }
livekit-api = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
