[package]
name = "libwebrtc"
version = "0.3.40"
edition.workspace = true
homepage = "https://livekit.io"
license.workspace = true
description = "Livekit safe bindings to libwebrtc"
repository.workspace = true

[features]
default = []

# On Wayland, libwebrtc uses GDBus to communicate with the XDG Desktop Portal.
# GDBus requires a GLib event loop to be running. Enable this feature if you
# wish to use screensharing, and you do not already have a GLib event loop
# running in your application.
glib-main-loop = [ "dep:glib" ]

[dependencies]
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
glib = { version = "0.21.3", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_env = "ohos"), not(target_os = "android")))'.dependencies]
webrtc-sys = { workspace = true }
livekit-runtime = { workspace = true, features = ["tokio"] }
lazy_static = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["sync", "macros"] }
cxx = "1.0"
rtrb = "0.3.3"

[target.'cfg(any(target_env = "ohos", target_os = "android"))'.dependencies]
rtc = { workspace = true }
rtc-shared = { workspace = true }
rtc-datachannel = { workspace = true }
rtc-dtls = { workspace = true }
rtc-ice = { workspace = true }
rtc-rtp = { workspace = true }
rtc-rtcp = { workspace = true }
rtc-srtp = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }
parking_lot = { workspace = true }
livekit-runtime = { workspace = true }
bytes = "1.5"
opus = { workspace = true }
soxr-sys = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
sonora = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "MessageEvent",
  "RtcPeerConnection",
  "RtcSignalingState",
  "RtcSdpType",
  "RtcSessionDescriptionInit",
  "RtcPeerConnectionIceEvent",
  "RtcIceCandidate",
  "RtcDataChannel",
  "RtcDataChannelEvent",
  "RtcDataChannelState",
  "EventTarget",
  "WebGlRenderingContext",
  "WebGlTexture",
] }

[dev-dependencies]
env_logger = { workspace = true }
