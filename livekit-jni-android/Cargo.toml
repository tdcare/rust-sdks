[package]
name = "livekit-jni-android"
version = "0.1.0"
edition = "2021"
description = "LiveKit JNI bindings for Android — P2P (SwcEngine) + SFU (LkRoom)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# SmartWard P2P engine
p2p = { path = "../p2p" }
# LiveKit SFU room
livekit = { path = "../livekit", features = [
    "__rustls-tls",
    "rustls-tls-webpki-roots",
] }
libwebrtc = { path = "../libwebrtc" }
livekit-runtime = { path = "../livekit-runtime" }

# JNI
jni = "0.21"

# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
parking_lot = "0.12"
log = "0.4"
android_logger = "0.14"
thiserror = "2"
