[package]
name = "rtc-shared"
version = "0.9.0"
authors = ["WebRTC.rs"]
edition = "2021"
description = "RTC Shared in Rust - OpenHarmony patched version"
license = "MIT OR Apache-2.0"

[features]
default = ["crypto", "ifaces", "marshal", "replay"]
crypto = []
ifaces = []
marshal = []
replay = []

[dependencies]
thiserror = "2.0"
substring = "1.4.5"
bytes = "1.5"
aes-gcm = { version = "0.10.3", features = ["std"] }
url = "2.5.0"
rcgen = "0.14"
sec1 = { version = "0.7.3", features = ["std"] }
p256 = { version = "0.13.2", features = ["default", "ecdh", "ecdsa"] }
aes = "0.8.4"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }

# Windows 依赖
[target.'cfg(windows)'.dependencies]
bitflags = "1.3"
winapi = { version = "0.3.9", features = [
    "basetsd",
    "guiddef",
    "ws2def",
    "winerror",
    "ws2ipdef",
] }

# Unix (非 Windows 且非 OpenHarmony) 依赖
[target.'cfg(all(unix, not(target_env = "ohos")))'.dependencies]
nix = "0.26.2"
