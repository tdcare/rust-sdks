[workspace]
resolver = "2"
members = [
    "livekit",
    "livekit-api",
    "livekit-protocol",
    "livekit-ffi",
    "livekit-uniffi",
    "livekit-datatrack",
    "livekit-ffi-node-bindings",
    "livekit-runtime",
    "livekit-wakeword",
    "livekit-napi-ohos",
    "libwebrtc",
    "p2p",
    "soxr-sys",
    "yuv-sys",
    "imgproc",
    "device-info",
    "webrtc-sys",
    "webrtc-sys/build",

    "examples/agent_dispatch",
    "examples/api",
    "examples/basic_data_track",
    "examples/basic_room",
    "examples/basic_text_stream",
    "examples/data_track_benchmark",
    "examples/encrypted_text_stream",
    "examples/local_audio",
    "examples/local_video",
    "examples/mobile",
    "examples/play_from_disk",
    "examples/rpc",
    "examples/save_to_disk",
    "examples/screensharing",
    "examples/send_bytes",
    "examples/webhooks",
    "examples/wgpu_room",
]

# rtc-patched is a self-contained workspace (webrtc-rs/rtc fork with OHOS patches).
# It must not be folded into this workspace; otherwise its `version.workspace = true`
# inheritance resolves against this manifest's `[workspace.package]` (which lacks `version`).
exclude = [
    "rtc-patched",
    "libvpx-build",
]

[workspace.package]
edition = "2021"
homepage = "https://livekit.io"
repository = "https://github.com/livekit/rust-sdks"
license = "Apache-2.0"
# NOTE: This `version` is not consumed by any crate in this workspace (each defines
# its own literal `version`). It only exists to satisfy `version.workspace = true`
# inheritance from the rtc-patched sub-workspace when Cargo resolves path deps
# across the outer/inner workspace boundary.
version = "0.20.0-alpha.1"

[workspace.dependencies]
device-info = { version = "0.1.1", path = "device-info" }
imgproc = { version = "0.3.19", path = "imgproc" }
libwebrtc = { version = "0.3.36", path = "libwebrtc" }
livekit = { version = "0.7.45", path = "livekit" }
livekit-api = { version = "0.5.1", path = "livekit-api" }
livekit-ffi = { version = "0.12.63", path = "livekit-ffi" }
livekit-datatrack = { version = "0.1.8", path = "livekit-datatrack" }
livekit-protocol = { version = "0.7.8", path = "livekit-protocol" }
livekit-runtime = { version = "0.4.0", path = "livekit-runtime" }
soxr-sys = { version = "0.1.3", path = "soxr-sys" }
webrtc-sys = { version = "0.3.34", path = "webrtc-sys" }
webrtc-sys-build = { version = "0.3.18", path = "webrtc-sys/build" }
yuv-sys = { version = "0.3.14", path = "yuv-sys" }

anyhow = "1.0"
bytes = "1.10"
clap = "4.5"
console-subscriber = "0.1"
env_logger = "0.11"
from_variants = "1.0.2"
futures = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
lazy_static = "1.4"
log = "0.4"
parking_lot = "0.12"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
rand = "0.9"
serde = "1"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
hound = "3.5"
opus = "0.3"
aes-gcm = "0.10"
sha2 = "0.10"

# webrtc-rs/rtc (OHOS patched) - Sans-I/O WebRTC implementation
rtc = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc" }
rtc-shared = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-shared", default-features = false }
rtc-datachannel = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-datachannel" }
rtc-dtls = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-dtls" }
rtc-ice = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-ice" }
rtc-interceptor = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-interceptor" }
rtc-mdns = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-mdns" }
rtc-media = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-media" }
rtc-rtcp = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-rtcp" }
rtc-rtp = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-rtp" }
rtc-sctp = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-sctp" }
rtc-sdp = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-sdp" }
rtc-srtp = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-srtp" }
rtc-stun = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-stun" }
rtc-turn = { version = "0.20.0-alpha.1", path = "rtc-patched/rtc-turn" }

# For examples
eframe = { version = "0.33.3", default-features = false }
egui = "0.33.3"
egui-wgpu = "0.33.3"
image = "0.25"
wgpu = "28.0"
winit = "0.30.12"
cc = { version = "1.0", features = ["parallel"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
debug = false

